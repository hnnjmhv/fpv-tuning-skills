name: Test Skills and Analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,plots]"
      - run: python -m pip install --no-deps -e .
      - run: python tools/validate_skills.py
      - run: python -m pytest -q
      - run: python examples/generate_demo.py --out .local/demo
      - run: fpv-tune analyze --csv .local/demo/flight-1.csv --config .local/demo/dump.txt --profile 0 --out .local/demo/plot-check --plots
